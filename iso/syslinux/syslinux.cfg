SERIAL 0 115200
UI vesamenu.c32
MENU TITLE SoraOS
MENU BACKGROUND splash.png

MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 7
MENU VSHIFT 10
MENU TABMSGROW 14
MENU CMDLINEROW 14
MENU HELPMSGROW 16
MENU HELPMSGENDROW 29

MENU COLOR border       30;44   #40e789a0 #a00d1117 std
MENU COLOR title        1;36;44 #e0e6edf3 #a00d1117 std
MENU COLOR sel          7;37;40 #0d1117 #e0e789a0 all
MENU COLOR unsel        37;44   #80e6edf3 #a00d1117 std
MENU COLOR help         37;40   #c0e6edf3 #a00d1117 std
MENU COLOR timeout_msg  37;40   #80e6edf3 #00000000 std
MENU COLOR timeout      1;37;40 #c0e789a0 #00000000 std
MENU COLOR msg07        37;40   #90e6edf3 #a00d1117 std
MENU COLOR tabmsg       31;40   #30e6edf3 #00000000 std

MENU CLEAR
MENU IMMEDIATE

DEFAULT soraos
PROMPT 0
TIMEOUT 50

LABEL soraos
TEXT HELP
Boot the SoraOS live desktop on BIOS.
ENDTEXT
MENU LABEL SoraOS Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL soraos-speech
TEXT HELP
Boot the SoraOS live desktop with the speakup screen reader.
ENDTEXT
MENU LABEL SoraOS Live (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
